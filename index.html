    />
    <meta property="og:title" content="Kostody . Proof at every step, for every repair in Nigeria" />

      content="Track repairs with time-stamped condition photos, fixed quotes, and 4-digit PIN authorization. No arguments, just proof."

    />
    <meta name="twitter:image" content="https://kostody.vercel.app/apple-touch-icon.png" />
    <script>
      (function () {
        var stored = window.localStorage
          ? localStorage.getItem("kostody_theme")
          : null;
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia &&
                window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
